# Render Blueprint —— 一键部署
# 在 Render 控制台 "New" → "Blueprint" → 关联本仓库，Render 会按此文件建服务。
services:
  - type: web
    name: tractor-online
    runtime: docker
    plan: free   # 必须显式写 free；省略会默认 starter(付费)并弹绑卡，切勿删除
    region: singapore   # 离中国最近，延迟最低（免费计划可选 oregon/frankfurt/ohio/virginia/singapore）
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
